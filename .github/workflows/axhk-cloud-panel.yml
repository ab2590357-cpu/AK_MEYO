name: A-X-HK Cloud Bot Panel QA
on:
  push:
    branches: ["feature/vercel-bot-panel"]
    paths: ["bot-panel/**","bot-public/**",".github/workflows/axhk-cloud-panel.yml"]
  pull_request:
    paths: ["bot-panel/**",".github/workflows/axhk-cloud-panel.yml"]
permissions:
  contents: read
jobs:
  panel-build-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install panel dependencies
        working-directory: bot-panel
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Syntax and regression checks
        working-directory: bot-panel
        run: |
          node --check api/index.js
          node --check termux-agent.mjs
          node --check public/assets/cloud.js
          node --check public/assets/public-control.js
          node --check ../bot-public/api/index.js
          node --check ../bot-public/public/assets/site.js
          npm test
