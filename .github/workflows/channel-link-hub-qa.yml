name: Channel Link Hub QA
on:
  push:
    branches:
      - feature/channel-link-hub
  pull_request:
    paths:
      - "channel-hub/**"
      - "lib/services/channel-hub-worker.js"
      - "lib/index.js"
      - "tests/channel-hub-*.mjs"
      - ".github/workflows/channel-link-hub-qa.yml"
permissions:
  contents: read
jobs:
  channel-hub-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install existing bot packages
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Syntax check
        run: |
          node --check channel-hub/api/index.js
          node --check channel-hub/public/app.js
          node --check lib/services/channel-hub-worker.js
          node --check lib/index.js
          node --check lib/services/link-logo.js
          node --check lib/services/menu-card.js
          node --check lib/utils/image-assets.js
      - name: Run Channel Hub regression tests
        run: AXHK_TERMUX_MODE=1 node --test tests/channel-hub-api.test.mjs tests/channel-hub-worker.test.mjs tests/channel-menu.test.mjs tests/dashboard-image-upload.test.mjs
