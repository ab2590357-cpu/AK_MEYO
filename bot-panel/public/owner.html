<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#100b12"><title>A-X-HK • Private Owner Login</title><link rel="icon" href="/assets/favicon.svg">
<style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color-scheme:dark}*{box-sizing:border-box}
body{margin:0;background:#080910;color:#f9f4f4;min-height:100vh;display:grid;place-items:center;padding:22px;
background-image:radial-gradient(circle at 70% 13%,rgba(224,30,77,.18),transparent 42%),radial-gradient(circle at 8% 85%,rgba(223,92,57,.12),transparent 39%)}
main{width:min(450px,100%);background:linear-gradient(153deg,#21121c,#100e19 68%);border:1px solid #573144;padding:clamp(25px,6vw,44px);border-radius:21px;box-shadow:0 35px 100px #0009}
.logo{width:64px;height:64px;padding:11px;background:#0a090d;border:1px solid #7b3448;border-radius:17px}
.overline{color:#ff889f;letter-spacing:.23em;font-size:11px;font-weight:800;margin:25px 0 8px}
h1{font-size:clamp(29px,6vw,43px);line-height:1.07;letter-spacing:-.04em;margin:0 0 16px}
h1 span{color:#fa6075}p{color:#baaeb8;font-size:14px;line-height:1.7;margin-bottom:27px}
label{display:block;font-size:12px;font-weight:700;margin:0 0 10px}input{width:100%;padding:15px;border:1px solid #684457;background:#0a0b12;color:#fff;border-radius:10px;font:inherit;outline:none}
input:focus{border-color:#fb6781;box-shadow:0 0 0 3px #f568802e}
button{width:100%;cursor:pointer;border:0;border-radius:10px;padding:15px;background:linear-gradient(100deg,#ef3658,#b91d46);color:#fff;font-weight:800;font-size:14px;margin-top:17px}
button:hover{filter:brightness(1.15)}button:disabled{opacity:.55;cursor:wait}
small{display:block;text-align:center;color:#b1a1ae;margin-top:18px;font-size:11px}
#message{color:#ffacaf;font-size:12px;min-height:18px;margin-top:12px}
</style></head><body><main>
<img src="/assets/logo.svg" class="logo" alt="A-X-HK"/>
<div class="overline">ENCRYPTED OWNER ACCESS</div>
<h1>A-X-HK<br/><span>Command Center.</span></h1>
<p id="intro">Your WhatsApp sessions remain on Termux. This private Vercel panel controls them over a secured outbound bridge.</p>
<form id="form"><label for="password">Owner dashboard password</label><input id="password" type="password" autocomplete="current-password" minlength="14" required placeholder="Enter your secure password"/>
<button id="submit" type="submit">Unlock dashboard</button><div id="message" role="status" aria-live="polite"></div></form>
<small>Protected by Vercel Authentication + private owner session • A-X-HK</small>
</main><script>
(async()=>{
 const intro=document.getElementById('intro'),btn=document.getElementById('submit'),form=document.getElementById('form'),msg=document.getElementById('message'),password=document.getElementById('password');
 try{
 const r=await fetch('/api/cloud/auth',{cache:'no-store'});const d=await r.json();
 if(d.authenticated){location.replace('/dashboard');return}
 const setup=!d.configured;
 if(setup){intro.textContent='First-time cloud setup: create a NEW 14+ character password for this Vercel panel. Your original Termux password stays on the phone.';btn.textContent='Set up protected Owner Login';password.setAttribute('autocomplete','new-password')}
 form.onsubmit=async e=>{
  e.preventDefault();btn.disabled=true;msg.textContent='Authenticating…';
  try{
   const r=await fetch(setup?'/api/cloud/setup':'/api/cloud/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:password.value})});
   const d=await r.json();if(!r.ok)throw Error(d.error||'Authentication failed');
   location.replace('/dashboard');
  }catch(e){msg.textContent=e.message;btn.disabled=false}
 };
 }catch(e){msg.textContent='Private panel setup is not available: '+e.message}
})();
</script></body></html>
